<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17152c"><meta name="description" content="Pou de regreso a casa con Liam: juego móvil de saltos y plataformas.">
<title>Pou de regreso a casa con Liam</title><link rel="stylesheet" href="./style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
</head>
<body>
<main id="game-shell" aria-label="Pou de regreso a casa con Liam">
<header><div class="brand"><span class="brand-pou">●</span><div><strong>Pou de regreso a casa</strong><small>con Liam</small></div></div><div class="scorebox">PUNTOS <b id="score">0</b></div></header>
<section id="stage"><canvas id="game" aria-label="Juego Pou"></canvas>
<div id="start-screen" class="overlay"><div class="pou-mark">●</div><h1>¡Pou vuelve a casa!</h1><p>Salta cada vez más alto. No dejes que Pou caiga.</p><button id="start-btn">JUGAR</button><small>Inclina el teléfono o usa ◀ ▶</small></div>
<div id="game-over" class="overlay hidden"><h2>¡Buen intento!</h2><p>Puntuación: <strong id="final-score">0</strong></p><p id="save-status" role="status">Guardando récord…</p><button id="restart-btn">VOLVER A JUGAR</button></div>
<div id="touch-controls" class="touch-controls hidden"><button id="left-btn" aria-label="Mover a la izquierda">◀</button><button id="right-btn" aria-label="Mover a la derecha">▶</button></div>
</section><footer><span id="sensor-status">Preparando controles…</span><span>Récord local: <b id="best">0</b></span></footer>
</main><script src="./game.js"></script>
</body></html>
